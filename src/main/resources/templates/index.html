<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <img alt="" class="d-inline-block align-text-top" height="24" src="images/weather-app.png" width="30">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3" th:text="${user.login}"></span>
            <button class="btn btn-outline-danger" th:href="@{/logout}">Sign out</button>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <div class="d-flex my-4">
            <form method="get" action="/search" class="d-flex w-100">
                <div class="input-group location-search-input-group me-3">
                    <input class="form-control" name="name" placeholder="Enter location"
                           required type="text" th:value="${param.name}">
                    <button class="btn btn-outline-secondary btn-sm clear-input-button"
                            type="button" onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>

        <div>
            <div class="row">
                <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="location : ${indexPageDto.locationWeathers}">
                    <div class="card h-100 position-relative weather-card">
                        <div class="position-absolute weather-card-delete-form">
                            <button aria-label="Delete" class="btn-close"></button>
                        </div>
                        <img alt="Weather icon"
                             class="card-img-top img-fluid"
                             th:src="'https://openweathermap.org/img/wn/' + ${location.icon} + '@4x.png'">
                        <div class="card-body d-flex flex-column">
                            <h1 class="card-text" th:text="${location.temp} + '°C'">°C</h1>
                            <h3 class="card-title" th:text="${location.name} + ',' + ${location.country}"></h3>
                            <p class="card-text mb-1"
                               th:text="'Feels like' + ${location.feelsLike} + '°C. ' + ${location.description}"></p>
                            <p class="card-text mb-1" th:text="'Humidity: ' +  ${location.humidity} + '%'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
